[package]
name = "entrance-analyser-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend for the entrance analyser sampling tool (OSM Science 2026)."

[dependencies]
axum = "0.7"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
geo = "0.33.1"
indexmap = { version = "2.12.0", features = ["serde"] }
rand = "0.10.1"
reqwest = { version = "0.12.25", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# `serde_yaml` is marked deprecated upstream but is still the most
# ubiquitous YAML reader in the ecosystem; swapping to `serde_yml`
# later is a drop-in replacement if/when a concrete need appears.
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
tempfile = "3.27.0"
tiff = "0.11.3"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
rstest = "0.26.1"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[[bin]]
name = "entrance-analyser-build-grid"
path = "src/bin/build_grid.rs"

[[bin]]
name = "entrance-analyser-ensure-db"
path = "src/bin/ensure_db.rs"

[[bin]]
name = "entrance-analyser-migrate"
path = "src/bin/migrate.rs"
